# Polish Public Transport Card — example configurations
# Requires: Polish Public Transport integration (HACS or manual install)
# Entity IDs are auto-generated by Home Assistant from stop names.
# Find yours under Developer Tools → States, or use the Card Editor UI.

# ── Minimal single-stop ──────────────────────────────────────────────────
type: custom:polish-transport-card
entities:
  - sensor.brama_wyzynna_03_odjazdy

---
# ── Mixed bus + tram (same transfer hub) ──────────────────────────────────
type: custom:polish-transport-card
title: Gdańsk Główny
entities:
  - sensor.dworzec_glowny_01_odjazdy
  - sensor.dworzec_glowny_02_odjazdy
max_departures: 10

---
# ── Multi-city dashboard ─────────────────────────────────────────────────
type: custom:polish-transport-card
view_mode: mixed
entities:
  - sensor.brama_wyzynna_03_odjazdy         # Gdańsk
  - sensor.dworzec_pks_02_odjazdy            # Gdańsk
  - sensor.centrum_01_odjazdy                # Warszawa
  - sensor.katowice_dworzec_pkp_odjazdy      # Katowice / GZM
  - sensor.ogrod_saski_01_odjazdy            # Lublin
  - sensor.uniwersytet_odjazdy               # Toruń
max_departures: 10

---
# ── Łódź bus stop group (transfer hub) ───────────────────────────────────
type: custom:polish-transport-card
entities:
  - sensor.zgierska_limanowskiego_balucki_rynek_odjazdy

---
# ── Tabs per stop ────────────────────────────────────────────────────────
type: custom:polish-transport-card
view_mode: tabs
entities:
  - sensor.dworzec_pks_02_odjazdy
  - sensor.centrum_01_odjazdy
max_departures: 10

---
# ── Route + destination filter ───────────────────────────────────────────
type: custom:polish-transport-card
entities:
  - entity: sensor.brama_wyzynna_03_odjazdy
    filter_routes: ["2", "8"]
    destination_filter: ["Wrzeszcz"]

---
# ── Night lines only ─────────────────────────────────────────────────────
type: custom:polish-transport-card
entities:
  - sensor.brama_wyzynna_03_odjazdy
filter_routes: ["N1", "N2", "N3", "N4", "N6", "N8", "N14"]

---
# ── Realtime-only departures ─────────────────────────────────────────────
type: custom:polish-transport-card
entities:
  - entity: sensor.centrum_01_odjazdy
    realtime_only: true

---
# ── Theme, clock and vehicle-type filter ─────────────────────────────────
type: custom:polish-transport-card
entities:
  - sensor.centrum_01_odjazdy
header_style: theme       # provider | theme | custom
show_clock: true
time_format: 24h
filter_vehicle_types: ["tram"]
show_vehicle: false

---
# ── Compact preset ───────────────────────────────────────────────────────
type: custom:polish-transport-card
display_preset: native
entities:
  - sensor.brama_wyzynna_03_odjazdy
  - sensor.centrum_01_odjazdy
  - sensor.katowice_dworzec_pkp_odjazdy

---
# ── Grouped by line + two columns (tablet / wide card) ───────────────────
type: custom:polish-transport-card
view_mode: grouped
columns: 2
show_refresh: true
entities:
  - sensor.brama_wyzynna_03_odjazdy
  - sensor.dworzec_pks_02_odjazdy

---
# ── Only the next 30 minutes, low-floor vehicles ─────────────────────────
type: custom:polish-transport-card
entities:
  - entity: sensor.centrum_01_odjazdy
    max_minutes: 30
    only_low_floor: true
hide_departed: true
departed_grace_minutes: 1

---
# ── E-ink preset (black & white, no animations) ──────────────────────────
type: custom:polish-transport-card
display_preset: e_ink
entities:
  - sensor.brama_wyzynna_03_odjazdy

---
# ── Rail — PKP / SKM / Polregio / IC ─────────────────────────────────────
type: custom:polish-transport-card
entities:
  - sensor.gdansk_glowny_odjazdy
filter_platform: "1"

---
# ── Rail — mixed operators ───────────────────────────────────────────────
type: custom:polish-transport-card
entities:
  - sensor.gdansk_glowny_odjazdy
  - sensor.gdynia_glowna_odjazdy

---
# ── Regional bus — kiedyPrzyjedzie carriers ──────────────────────────────
type: custom:polish-transport-card
entities:
  - sensor.gryf_odjazdy
  - sensor.pks_gdansk_odjazdy

---
# ── Row actions ──────────────────────────────────────────────────────────
type: custom:polish-transport-card
entities:
  - sensor.brama_wyzynna_03_odjazdy
tap_action:
  action: navigate
  navigation_path: /lovelace/transport
hold_action:
  action: more-info

---
# ── Per-sensor sleep modes (via integration options) ─────────────────────
# Available per-entry under Settings → Devices & Services → Polish Public Transport → Configure
# sleep_enabled: true | false
# sleep_start: "23:00"
# sleep_end: "05:00"
# (pauses API polling during specified hours to save bandwidth)

---
# ── Highlight mode (dim filtered instead of hiding) ──────────────────────
type: custom:polish-transport-card
entities:
  - sensor.brama_wyzynna_03_odjazdy
filter_routes: ["2"]
highlight_mode: true
