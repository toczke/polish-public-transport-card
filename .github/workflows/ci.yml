name: CI

on:
  push:
    branches: [main, code-cleanup, "**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Run full test suite
        run: python -m pytest -q --tb=short

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build card
        run: npm run build
      - name: Verify committed card is up to date
        run: |
          if ! git diff --exit-code -- custom_components/mzkzg_transport/www/polish-transport-card.js; then
            echo "::error::The built card is stale. Run 'npm run build' and commit the result."
            exit 1
          fi

  validate:
    name: Manifest, translations and HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifest, translations and versions
        run: |
          python - <<'PY'
          import json, os, re, sys
          from pathlib import Path

          manifest = json.loads(Path("custom_components/mzkzg_transport/manifest.json").read_text(encoding="utf-8"))
          hacs = json.loads(Path("hacs.json").read_text(encoding="utf-8"))
          en = json.loads(Path("custom_components/mzkzg_transport/translations/en.json").read_text(encoding="utf-8"))
          pl = json.loads(Path("custom_components/mzkzg_transport/translations/pl.json").read_text(encoding="utf-8"))

          assert manifest.get("domain") == "mzkzg_transport", manifest
          assert manifest.get("version"), "manifest.version is missing"
          assert manifest.get("config_flow") is True
          assert hacs.get("name"), "hacs.json is missing name"
          assert en.keys() == pl.keys(), f"translation sections differ: {en.keys() ^ pl.keys()}"
          for section in ("config", "options"):
              if section in en:
                  assert en[section] == pl[section] or en[section].keys() == pl[section].keys()

          src = Path("src/utils.js").read_text(encoding="utf-8")
          card_version = re.search(r'CARD_VERSION\s*=\s*"([^"]+)"', src)
          assert card_version, "CARD_VERSION missing from src/utils.js"
          assert card_version.group(1) == manifest["version"], (
              f"manifest {manifest['version']} != card {card_version.group(1)}"
          )

          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/v"):
              tag_version = ref.rsplit("/", 1)[-1].lstrip("v")
              assert tag_version == manifest["version"], (
                  f"tag {tag_version} != manifest {manifest['version']}"
              )

          print(f"OK: {manifest['domain']} v{manifest['version']}")
          PY

      - name: Home Assistant hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  e2e:
    name: Card E2E
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E and visual snapshots
        run: npx playwright test

  release-gate:
    name: Release gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [python, frontend, validate]
    steps:
      - uses: actions/checkout@v4
      - name: Confirm release tag is fully green
        run: echo "All CI jobs passed for ${GITHUB_REF_NAME}."
