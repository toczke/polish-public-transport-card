name: Auto release

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  auto-release:
    name: Release unreleased commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTORELEASE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements_test.txt
          npm ci

      - name: Run Python tests
        run: python -m pytest -q --tb=short

      - name: Lint and build card
        run: |
          npm run lint
          npm run build

      - name: Check for unreleased commits and choose version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          LATEST_TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$LATEST_TAG" ]; then
            COMMITS="$(git rev-list --count "${LATEST_TAG}..HEAD")"
            LATEST_VERSION="${LATEST_TAG#v}"
          else
            COMMITS="$(git rev-list --count HEAD)"
            LATEST_VERSION="0.0.0"
          fi
          MANIFEST_VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("custom_components/mzkzg_transport/manifest.json").read_text())["version"])
          PY
          )"
          VERSION="$(python - "$LATEST_VERSION" "$MANIFEST_VERSION" <<'PY'
          import re
          import sys

          latest, manifest = sys.argv[1], sys.argv[2]

          def parts(value):
              return tuple(int(part) for part in re.findall(r"\d+", value)[:3])

          latest_parts, manifest_parts = parts(latest), parts(manifest)
          if manifest_parts > latest_parts:
              print(manifest)
          else:
              major, minor, patch = (latest_parts + (0, 0, 0))[:3]
              print(f"{major}.{minor}.{patch + 1}")
          PY
          )"
          # Never reuse an existing tag.
          while git rev-parse "v${VERSION}" >/dev/null 2>&1; do
            VERSION="$(python - "$VERSION" <<'PY'
          import sys
          major, minor, patch = sys.argv[1].split(".")
          print(f"{major}.{minor}.{int(patch) + 1}")
          PY
            )"
          done
          echo "commits=${COMMITS}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${COMMITS}" -gt 0 ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Unreleased commits: ${COMMITS}; next version: ${VERSION}"

      - name: Update release metadata
        if: steps.version.outputs.release == 'true'
        run: |
          python - "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.latest_tag }}" <<'PY'
          import json
          import re
          from datetime import date
          from pathlib import Path

          version = __import__("sys").argv[1]
          previous = __import__("sys").argv[2] or "the first release"
          root = Path(".")

          manifest = root / "custom_components/mzkzg_transport/manifest.json"
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data["version"] = version
          manifest.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          const = root / "custom_components/mzkzg_transport/const.py"
          text = const.read_text(encoding="utf-8")
          text = re.sub(r'INTEGRATION_VERSION = "[^"]+"', f'INTEGRATION_VERSION = "{version}"', text)
          const.write_text(text, encoding="utf-8")

          utils = root / "src/utils.js"
          text = utils.read_text(encoding="utf-8")
          text = re.sub(r'CARD_VERSION = "[^"]+"', f'CARD_VERSION = "{version}"', text)
          utils.write_text(text, encoding="utf-8")

          readme = root / "README.md"
          text = readme.read_text(encoding="utf-8")
          text = re.sub(r"version-[0-9]+\.[0-9]+\.[0-9]+-blue\.svg", f"version-{version}-blue.svg", text)
          readme.write_text(text, encoding="utf-8")

          changelog = root / "CHANGELOG.md"
          text = changelog.read_text(encoding="utf-8")
          heading = f"## [{version}] - {date.today().isoformat()}"
          if heading not in text:
              entry = (
                  f"{heading}\n\n"
                  "### Changed\n"
                  f"- Automated release of changes merged since {previous}.\n\n"
              )
              text = text.replace("# Changelog\n\n", "# Changelog\n\n" + entry, 1)
              changelog.write_text(text, encoding="utf-8")
          PY
          npm run build

      - name: Commit and push release version
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No metadata changes to commit"
          else
            git commit -m "chore(release): ${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Build HACS archive
        if: steps.version.outputs.release == 'true'
        run: |
          rm -f polish-public-transport-card.zip
          zip -r polish-public-transport-card.zip \
            custom_components/mzkzg_transport \
            hacs.json README.md LICENSE CHANGELOG.md

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Polish Public Transport Card v${{ steps.version.outputs.version }}
          target_commitish: main
          files: polish-public-transport-card.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
