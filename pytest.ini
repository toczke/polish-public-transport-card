[pytest]
testpaths = tests
asyncio_mode = auto
addopts = --cov=custom_components/mzkzg_transport --cov-report=term-missing --cov-fail-under=60
markers =
    common: shared integration and entity tests
    gdansk: ZTM Gdansk provider tests
    gdynia: ZKM Gdynia provider tests
    gtfsrt: GTFS and GTFS-RT provider tests
    kiedyprzyjedzie: KiedyPrzyjedzie provider tests
    krakow: ZTP Krakow (zbiorkom.live) provider tests
    lodz: MPK Lodz provider tests
    plk: PKP PLK provider tests
    tczew: Time4Bus Tczew provider tests
